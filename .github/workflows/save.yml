# Regenerates the expected result (.tlg) of every test in the reference
# environment (the same TeX Live image as the "Tests" workflow) and opens a
# pull request with the changes, so that you can read them before merging.
#
# Run it from the "Actions" tab: "Save expected results" -> "Run workflow".
# Do it after a TeX Live update made the tests fail for reasons that are not
# bugs, or after adding or changing tests.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests".
name: Save expected results

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Configuration (empty = all): build, config-multirun, config-bib, config-compat, config-engines"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate the .tlg files
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          texlive_version: latest
          run: |
            apk add --no-cache diffutils inkscape python3 py3-pygments ttf-dejavu
            if [ -n "${{ inputs.config }}" ]; then
              l3build saveall -c "${{ inputs.config }}"
            else
              l3build saveall
            fi

      # The container wrote the files as root.
      - name: Give the files back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Open a pull request with the new results
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-expected-results
          delete-branch: true
          add-paths: "testfiles*/*.tlg"
          commit-message: "Update expected test results (TeX Live latest)"
          title: "Update expected test results"
          body: |
            Generated by `l3build saveall` in the latest TeX Live image.

            Read the diff before merging: a change is acceptable only if it
            comes from another package or from TeX Live (messages, versions),
            or from a change of mypackage/myreport that you intended.
